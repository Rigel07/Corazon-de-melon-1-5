name: Build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Descomprimir el zip y ordenar los archivos
        id: prep
        run: |
          set -e
          echo "Archivos en la raiz:"; ls -la

          # 1) Si no hay build.gradle en la raiz, el proyecto viene dentro de un .zip subido tal cual: se descomprime aqui.
          DIR="."
          if [ ! -f build.gradle ]; then
            ZIP=""; BEST=-1
            for z in *.zip; do
              [ -f "$z" ] || continue
              t=$(git log -1 --format=%ct -- "$z" 2>/dev/null || true)
              [ -n "$t" ] || t=0
              if [ "$t" -ge "$BEST" ]; then BEST=$t; ZIP="$z"; fi
            done
            if [ -z "$ZIP" ]; then
              echo "ERROR: no hay build.gradle en la raiz ni ningun .zip del mod en el repositorio"; exit 1
            fi
            echo "Descomprimiendo $ZIP ..."
            mkdir -p _proyecto
            unzip -q -o "$ZIP" -d _proyecto
            GRADLE=$(find _proyecto -name build.gradle | head -n 1)
            if [ -z "$GRADLE" ]; then echo "ERROR: el zip no contiene build.gradle"; exit 1; fi
            DIR=$(dirname "$GRADLE")
          fi
          echo "Proyecto en: $DIR"
          cd "$DIR"

          # 2) Paquete plano: cada archivo suelto va a su carpeta.
          J=src/main/java/com/corazondemelon
          A=src/main/resources/assets/corazondemelon
          place() {
            if [ -f "$1" ]; then mkdir -p "$2"; mv "$1" "$2/"; echo "movido $1 -> $2/"; fi
          }
          for f in *.java; do
            [ -f "$f" ] || continue
            PKG=$(grep -m1 '^package ' "$f" | sed 's/^package \([^;]*\);.*/\1/' | tr -d '\r ')
            if [ -z "$PKG" ]; then echo "ERROR: $f no tiene linea package"; exit 1; fi
            D="src/main/java/$(echo "$PKG" | tr . /)"
            mkdir -p "$D"; mv "$f" "$D/"; echo "movido $f -> $D/"
          done
          place mods.toml src/main/resources/META-INF
          place pack.mcmeta src/main/resources
          place en_us.json $A/lang
          place es_es.json $A/lang
          for f in corazon_magico corazon_magico_azul corazon_magico_dorado corazon_magico_violeta mao_spawn_egg; do place $f.json $A/models/item; done
          for f in corazon_magico corazon_magico_azul corazon_magico_dorado corazon_magico_violeta; do place $f.png $A/textures/item; done
          for f in mao mao_rosa mao_verde mao_azul mao_violeta; do place $f.png $A/textures/entity; done
          place mao_spawns.json src/main/resources/data/corazondemelon/forge/biome_modifier

          # 3) Comprobaciones
          test -f build.gradle || { echo "ERROR: no hay build.gradle"; exit 1; }
          test -d src/main/java || { echo "ERROR: falta src/main/java"; exit 1; }
          echo "Archivos .java encontrados: $(find src/main/java -name '*.java' | wc -l)"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.1.1

      - name: Compilar el mod
        working-directory: ${{ steps.prep.outputs.dir }}
        run: gradle build --no-daemon --stacktrace

      - name: Verificar que el .jar tiene el mod dentro
        working-directory: ${{ steps.prep.outputs.dir }}
        run: |
          ls -la build/libs
          JAR=$(ls build/libs/*.jar | grep -v -- '-sources' | head -n 1)
          echo "Revisando $JAR"
          unzip -l "$JAR" | grep -q 'META-INF/mods.toml' || { echo "ERROR: el jar no contiene mods.toml"; exit 1; }
          unzip -l "$JAR" | grep -q 'com/corazondemelon/CorazonDeMelon.class' || { echo "ERROR: el jar no contiene clases compiladas"; exit 1; }
          echo "OK: el jar contiene el mod"

      - name: Subir el .jar como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: corazon-de-melon
          path: ${{ steps.prep.outputs.dir }}/build/libs/*.jar

      - name: Publicar release (solo con tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.prep.outputs.dir }}/build/libs/*.jar
